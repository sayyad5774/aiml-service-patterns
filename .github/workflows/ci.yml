name: ci

on:
  push:
  pull_request:

jobs:
  churn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/churn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Tests
        run: |
          pytest -q
